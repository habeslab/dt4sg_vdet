name: gan-ics

services:
  disc-api:
    build:
      context: .
      dockerfile: ./disc-api/Dockerfile_disc
    container_name: disc-api
    restart: unless-stopped
    environment:
      MODEL_PATH: "/artifacts/rf_model_three.pkl"
      FEATS_PATH:  "/artifacts/features_three.json"
      AUTO_TUNE: "0"
      VAL_CSV: "/out_pipeline/gan_val_raw.csv"
      LOG_LEVEL: "DEBUG"
      MGMT_DHCP: "0"
      MODEL_VERSION: "1.0.0"
    cap_add: ["NET_ADMIN"]
    volumes:
      - ./out_pipeline:/out_pipeline:ro
      - ./out_pipeline/artifacts/features.json:/artifacts/features.json:ro
      - ./out_pipeline/artifacts/rf_model.pkl:/artifacts/rf_model.pkl:ro
      - ./out_pipeline/artifacts/features_three.json:/artifacts/features.json:ro
      - ./out_pipeline/artifacts/rf_model_three.pkl:/artifacts/rf_model_three.pkl:ro
    networks:
      - mgmt
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).getcode()==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  net-agent:
    build:
      context: .
      dockerfile: ./net-agent/Dockerfile_agent
    container_name: net-agent
    restart: unless-stopped
    depends_on:
      disc-api:
        condition: service_healthy
    environment:
      DISC_URL: "http://disc-api:8000" 
      ICS_IFACE: "eth1"         
      MGMT_IFACE: "eth0"                  
      BPF: "tcp port 2404"                           
      WINDOW_SEC: "60"                             
      GRACE_SEC: "2"                             
      GEN_ENABLED: "0"
      GEN_MODE: "feature"
      GEN_MODEL_PATH: "/artifacts/models/generator.keras"
      GEN_LATENT_DIM: "64"
      GEN_BATCH: "16"
      GEN_RATE_PER_MIN: "6"
      GEN_BURST: "2"
      FEATS_PATH: "/artifacts/features_three.json"
      MGMT_DHCP: "1"
      GNS3_MODE: "0"  
      ICS_DHCP: "0"
      ICS_PROMISC: "1"
      OUT_JSONL_PATH: "/data/flows.jsonl"
      DASH_PORT: "8080"     
      MGMT_NAT: "1"
      MGMT_IP_CIDR: "192.168.122.50/24"
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./out_pipeline/artifacts:/artifacts:ro
    networks:
      - mgmt
      - ics
    ports:
      - "8080:8080"

networks:
  mgmt:
    driver: bridge
  ics:
    driver: bridge
